name: Windows release checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            plugins/semantic-srs/requirements.txt
            plugins/local-rag/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r plugins/semantic-srs/requirements.txt
          python -m pip install --disable-pip-version-check -r plugins/local-rag/requirements.txt
      - name: Verify release
        shell: powershell
        run: .\scripts\verify-release.ps1
